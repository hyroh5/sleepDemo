name: Build IPA

# Actions 탭에서 수동으로 실행한다. 서명 없는 .ipa를 만들고, 설치할 때 Sideloadly가 서명한다.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 빌드 (서명 없음)
        run: |
          xcodebuild \
            -project SleepDemo.xcodeproj \
            -scheme SleepDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: .ipa 패키징
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SleepDemo.app Payload/
          zip -qr SleepDemo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SleepDemo-ipa
          path: SleepDemo.ipa
          retention-days: 7
