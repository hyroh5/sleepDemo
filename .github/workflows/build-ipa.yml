name: Build IPA

# Actions 탭에서 수동으로 실행한다. 서명 없는 .ipa를 만들고, 설치할 때 Sideloadly가 서명한다.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 빌드 (서명 없음)
        run: |
          set +e
          xcodebuild \
            -project SleepDemo.xcodeproj \
            -scheme SleepDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # 실제 컴파일 에러를 어노테이션으로 남겨 로그 없이도 확인할 수 있게 한다.
            grep -E "error:" build.log | sed "s#$PWD/##" | sort -u | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: .ipa 패키징
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SleepDemo.app Payload/
          zip -qr SleepDemo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SleepDemo-ipa
          path: SleepDemo.ipa
          retention-days: 7
